<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  body { width: 280px; font-family: -apple-system, sans-serif; padding: 12px; background: #1e1e1e; color: #e0e0e0; }
  h3 { margin: 0 0 10px; font-size: 14px; color: #f0f0f0; }
  .status { display: flex; align-items: center; gap: 8px; padding: 8px; background: #2a2a2a; border-radius: 6px; margin-bottom: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .dot.active { background: #60c060; }
  .dot.inactive { background: #c94040; }
  .label { font-size: 12px; color: #ccc; }
  .url { font-size: 11px; color: #888; margin-top: 4px; }
  .hint { font-size: 11px; color: #666; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
<h3>Robo Web Capture</h3>
<div class="status">
  <div class="dot" id="dot"></div>
  <div>
    <div class="label" id="statusLabel">Verbinde…</div>
    <div class="url" id="serverUrl"></div>
  </div>
</div>
<div class="hint" id="hint">Starte die Aufzeichnung in der Robo-App, um Browser-Interaktionen aufzuzeichnen.</div>
<script src="popup.js"></script>
</body>
</html>
